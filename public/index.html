<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octopus Sports Academy</title>
  <meta name="description" content="Book swimming classes at your condo in Malaysia. QR attendance and coach feedback.">
  <meta name="theme-color" content="#071a33">
  <script>
    // Apply the light/dark choice before the page paints (no flash). Dark is the default; a saved choice wins.
    var t = 'dark';
    try { var saved = localStorage.getItem('osa_theme'); if (saved === 'dark' || saved === 'light') t = saved; }
    catch (e) { console.warn('[theme] could not read the saved choice, using dark:', e.message); }
    document.documentElement.dataset.theme = t;
    if (!location.hash || location.hash === '#' || location.hash === '#/') {
      var l = document.createElement('link');
      // Same file the CSS picks (AVIF); a browser without AVIF skips this preload and uses WebP from the CSS
      l.rel = 'preload'; l.as = 'image'; l.type = 'image/avif'; l.fetchPriority = 'high';
      l.href = window.matchMedia('(max-width: 700px)').matches ? 'img/hero-900.avif' : 'img/hero.avif';
      document.head.appendChild(l);
    }
  </script>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/logo.svg">
  <link rel="manifest" href="manifest.json">
  <!-- Fonts are served from our own server (public/fonts). Preload starts both downloads right away,
       in parallel with style.css, instead of waiting until the CSS has been read. -->
  <link rel="preload" as="font" type="font/woff2" href="fonts/plus-jakarta-sans-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="fonts/bricolage-grotesque-latin.woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Octopus Sports Academy home">
      <img src="img/logo.svg" alt="" width="38" height="38">
      <span class="brand-text"><span class="brand-name">Octopus</span><span class="brand-tag">Sports Academy</span></span>
    </a>
    <div class="topbar-right">
      <nav id="nav"></nav>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode"></button>
    </div>
  </header>
  <main id="app" class="container" aria-live="polite"></main>
  <footer class="site-footer">
    <div class="inner">
      <a href="#/" class="brand"><img src="img/logo.svg" alt="" width="30" height="30"><span class="brand-name">Octopus</span></a>
      <span>Swimming classes at your condo · Malaysia</span>
      <span>© <span id="year"></span> Octopus Sports Academy</span>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" hidden></div>
  <!-- admin.js must load before app.js: app.js's route table refers to the admin() function -->
  <script src="admin.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
